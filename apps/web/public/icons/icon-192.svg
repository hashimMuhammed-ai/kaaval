<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14b8a6" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Glowing circle accent -->
  <circle cx="96" cy="96" r="64" fill="rgba(20, 184, 166, 0.08)" />

  <!-- Heart and Hands Symbol -->
  <g transform="translate(36, 36) scale(1)" filter="url(#glow)">
    <path
      d="M60 42c4.47-4.38 9-9.63 9-16.5A16.5 16.5 0 0 0 52.5 9c-5.28 0-9 1.5-13.5 6-4.5-4.5-8.22-6-13.5-6A16.5 16.5 0 0 0 9 25.5c0 6.9 4.5 12.15 9 16.5l21 21 21-21Z"
      fill="url(#primaryGrad)"
    />
    <!-- Medical Cross Emblem Inside Heart -->
    <path
      d="M36 21h6v6h6v6h-6v6h-6v-6h-6v-6h6z"
      fill="#ffffff"
      opacity="0.95"
    />
    <!-- Supporting Hand Arc -->
    <path
      d="M16 66c14 16 38 22 56 12 7-4 12-10 16-18"
      fill="none"
      stroke="#38bdf8"
      stroke-width="5"
      stroke-linecap="round"
    />
  </g>
</svg>
